name: Connells Group
kind: company
description: >-
  Connells Limited, trading as Connells Group, is the United Kingdom's largest
  estate agency and property services group, headquartered at Cumbria House in
  Leighton Buzzard, Bedfordshire, and a wholly owned subsidiary of Skipton
  Building Society. It states 1,200+ branches, 16,000+ colleagues, more than 80
  local brands including Connells, Countrywide, Hamptons, Sequence, Bairstow
  Eves, Fox & Sons, John D Wood & Co, Gascoigne Halman and Blundells, roughly
  115,000 property sales a year and about 10% market share, 165,000+ managed
  tenancies and £33bn+ of arranged mortgage lending. It occupies almost the
  entire residential value chain at once: estate agency, residential and
  corporate lettings, new homes, land and planning, auctions, surveys and
  valuations, conveyancing, mortgage services, asset management, affordable
  housing, EPCs and inventories, commercial agency and a research and
  consultancy practice. Its home market is the United Kingdom, where there is no
  MLS and no cooperative listing standard — residential stock reaches consumers
  through the Rightmove and Zoopla portal duopoly by way of agency CRM and
  website software rather than a shared pool, and Connells' own consumer
  property sites are built on the Homeflow platform. Its API posture is closed
  and undocumented. No developer portal exists: developer., developers., api.
  and docs.connellsgroup.co.uk do not resolve, and /developers, /api, /docs,
  /openapi.json, /swagger.json, /api-docs and /.well-known/openid-configuration
  return 404 on both connellsgroup.co.uk and connells.co.uk. It publishes no
  OpenAPI, no GraphQL, no AsyncAPI, no MCP server and no client SDK — the only
  first-party package on any public registry is a dormant npm colour-token file
  for its website. Probing on 2026-07-26 did, however, find a small live JSON
  surface underneath the consumer site at https://www.connells.co.uk/api: six
  anonymous read-only Next.js route handlers serving the branch finder, people
  directory, testimonials wall and place autocomplete, plus a seventh
  (/api/properties) that returns HTTP 500. These are undocumented internal
  website routes, not a product — unversioned, unsupported, rate limited by
  Cloudflare, capped at 12 records because no paging parameter works, and
  carrying application errors inside HTTP 200 bodies. Only connells.co.uk
  exposes them; the sibling brand sites redirect /api/* away. The group's 88-URL
  corporate sitemap contains no developer path — its one /developers/ page is
  addressed to property developers, not software developers. Integration is real
  but partner-only: Connells Survey & Valuation advertises delivering "totally
  integrated panel and risk management technology solutions to lenders" for the
  40+ lenders whose valuation panels it manages, and reaches them through
  third-party platforms such as Cotality's LenderHub, while Countrywide
  Surveying Services' Geoconnect engine is described as connecting internal and
  external data sources through API integrations it consumes rather than
  publishes. There is no RESO Web API or Data Dictionary certification, no OData
  $metadata document and no Universal Property Identifier anywhere in the estate
  — RESO is a North American NAR/MLS mechanism and the UK has no MLS to certify
  against. Connells publishes no open data either; its research product, covering
  88% of UK postcode areas from branch-level proprietary data, is sold through a
  brochure request and a contact form, and the genuinely open UK property layer
  belongs to the public sector (HM Land Registry Price Paid Data and Ordnance
  Survey), not to the brokerage.
