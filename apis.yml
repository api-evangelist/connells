apis:
- name: Connells Website JSON API (undocumented)
  description: >-
    An undocumented, unauthenticated, read-only JSON surface served by the
    Connells consumer website at https://www.connells.co.uk/api. It is NOT a
    published Connells Group product — the group publishes no developer portal,
    no documentation and no specification, and makes no commitment about these
    routes. They are Next.js App Router route handlers backing the site's branch
    finder, people directory, testimonials wall and place autocomplete, with
    content sourced from the Homeflow estate-agency platform that powers the
    Connells consumer estate. Six operations answered anonymous requests on
    2026-07-26 — listBranches, getBranch, listStaff, listTestimonials,
    listLocations and searchPlaces — while a seventh, /api/properties, returned
    HTTP 500 on every probe, so no property listings are available. The surface
    is unversioned, read-only (Allow: GET, HEAD, OPTIONS), rate limited by
    Cloudflare with HTTP 429 and Retry-After but no forward RateLimit headers,
    and hard-capped at 12 records per collection because no paging parameter is
    honoured despite pagination metadata advertising 162 branches and 841 staff.
    Application errors ride inside HTTP 200 bodies rather than in status codes.
    Only www.connells.co.uk exposes these handlers; the sibling Connells Group
    brand sites redirect /api/* away. The OpenAPI in this repo was derived by
    API Evangelist from live response captures, not published by the provider.
