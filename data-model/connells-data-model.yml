observations:
  - >-
    The graph has exactly one real foreign key (StaffMember.branchId). Everything
    else is either embedded eagerly or joined only by free text.
  - >-
    Two identifier namespaces coexist — integer ids for the agency-side entities
    (Branch, StaffMember, Testimonial) and ObjectId strings for the geography
    entities (Location, PlaceMatch) — which is consistent with the geography
    coming from the underlying Homeflow platform rather than from Connells.
  - >-
    There is no Property entity. The one route that would carry it,
    /api/properties, returns HTTP 500. Property listings on the consumer site
    are server-rendered from Homeflow, so the group's core asset — its ~115,000
    sales a year of stock — is absent from this surface entirely.
