findings:
- Absence is the finding. The UK's largest estate agency group — 1,200+ branches,
  ~10% of the market, ~115,000 sales a year — publishes no developer portal, no
  API documentation, no machine-readable contract, no SDK, no Postman
  collection, no changelog, no status page and not even an RSS feed.
- The gate is partner-only rather than none-published, and the distinction is
  deliberate. Connells does publish that programmatic integration exists — "totally
  integrated panel and risk management technology solutions to lenders" for 40+
  lenders, plus valuation instruction through Cotality's LenderHub — but the way
  in is a panel management contract or a platform partnership, never a developer
  registration. What is published is the existence of the integration, never its
  interface.
- The group's only /developers/ page is a homonym trap. It addresses property and
  housing developers, and the searchable content there is market insight sold via
  contact form. Any automated crawl looking for developer surfaces in this sector
  will hit this trap repeatedly across UK estate agencies.
- Connells is a data-rich company that sells data as a report, not as a feed. Its
  research covers 88% of UK postcode areas and blends proprietary branch data with
  third-party sources at UDPRN level — an unusually granular asset — and the only
  published way to obtain it is to request a brochure.
- No RESO anywhere, and structurally there could not be. RESO is a NAR/MLS
  mechanism, the UK has no MLS, and the RESO certified-organizations directory
  contains no UK entries at all. The de facto UK interchange format is the
  Rightmove V3 BLM XML feed — a private portal's bulk upload spec, not a
  standards-body contract. Certification is not merely unreachable here; the
  layer does not exist.
- No open data from Connells. The open UK property layer is HM Land Registry
  Price Paid and Ordnance Survey — public sector, not brokerage. This is the
  inverse of the United States, where the industry has a mandated machine-readable
  standard but the government publishes almost nothing.
- Connells consumes APIs heavily and publishes none. Homeflow runs its consumer
  search, Fixflo runs its lettings repairs, Cotality carries its valuation
  instructions, and Countrywide Surveying Services' Geoconnect engine is described
  as connecting internal and external data sources through API integrations. Every
  contract in that stack belongs to a vendor.
- Unlike Savills, Connells does not even leak an internal endpoints manifest. The
  1.1 MB consumer search page names no API host and no /api path. The private
  estate is invisible from outside, which makes the absence of any public surface
  harder to characterize as an oversight and easier to read as posture.

