caveats:
  - >-
    Every tool is read-only; the underlying surface exposes no write operation
    (Allow: GET, HEAD, OPTIONS).
  - >-
    A server built on these operations would be rate limited by Cloudflare (429
    with Retry-After) and could not paginate past the first 12 records of any
    collection.
  - >-
    No property listing tool is possible — the /api/properties route returns
    HTTP 500 and there is no other listings surface.
